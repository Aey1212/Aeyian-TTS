name: Current pipeline five-sentence benchmark

on:
  push:
    branches: [current-pipeline-five-sentence-test]
    paths:
      - '.github/workflows/current-pipeline-five-sentence.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Checkout current pipeline branch
        uses: actions/checkout@v4

      - name: Checkout exact O15 fixture source
        uses: actions/checkout@v4
        with:
          ref: L3b-lossless-source
          path: l3b-source

      - name: Install system tools and eSpeak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libpcaudio-dev libsonic-dev ffmpeg libsndfile1

      - name: Restore exact frozen O15 carrier
        run: |
          cat l3b-source/l3/fixtures/o15_wv_v2/chunk* > /tmp/O15.wv
          echo 'e21b9a9388cff95819a540de22a786dc5b0123a8299f2aef18432e296793ee72  /tmp/O15.wv' | sha256sum -c -
          ffmpeg -v error -y -i /tmp/O15.wv -ac 1 -ar 22050 -c:a pcm_s16le /tmp/O15.wav
          PCM_SHA=$(ffmpeg -v error -i /tmp/O15.wav -f s16le -acodec pcm_s16le -ac 1 -ar 22050 - | sha256sum | awk '{print $1}')
          echo "O15 decoded PCM SHA256=${PCM_SHA}"
          test "${PCM_SHA}" = '0b80cfa95e852bd1e0809653f2f7bc24321e58256ddfcbec0740bd2419c27101'

      - name: Build exact qce eSpeak-NG 1.52.0 frontend with benchmark lexicon
        run: |
          git clone --depth 1 --branch 1.52.0 https://github.com/espeak-ng/espeak-ng.git espeak-ng
          cp qce-ng-v1/phsource/ph_commune_elven espeak-ng/phsource/ph_commune_elven
          cat qce-ng-v1/phsource/phonemes.qce.block >> espeak-ng/phsource/phonemes
          cp qce-ng-v1/dictsource/qce_list espeak-ng/dictsource/qce_list
          cat l3/current_pipeline_benchmark_qce_list >> espeak-ng/dictsource/qce_list
          cp qce-ng-v1/dictsource/qce_rules espeak-ng/dictsource/qce_rules
          mkdir -p espeak-ng/espeak-ng-data/lang/art
          cp qce-ng-v1/espeak-ng-data/lang/art/qce espeak-ng/espeak-ng-data/lang/art/qce

          cmake -S espeak-ng -B espeak-ng/build -G Ninja \
            -DUSE_ASYNC=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"
          cmake --build espeak-ng/build --target espeak-ng
          cmake --build espeak-ng/build --target data
          (
            cd espeak-ng/dictsource
            ../build/src/espeak-ng --path=../build --compile=qce
          )
          test -s espeak-ng/build/espeak-ng-data/qce_dict
          cmake --install espeak-ng/build
          cp espeak-ng/build/espeak-ng-data/qce_dict "$GITHUB_WORKSPACE/install/share/espeak-ng-data/qce_dict"

      - name: Render exact Commune M1 phonetic prints
        run: |
          export PATH="$GITHUB_WORKSPACE/install/bin:$PATH"
          export ESPEAK_DATA_PATH="$GITHUB_WORKSPACE/install/share/espeak-ng-data"
          mkdir -p output/m1 output/f3 output/l3a

          while IFS='|' read -r label text gloss; do
            case "$label" in
              S1|S2|S3|S4|S5)
                echo "$label | $text | $gloss"
                espeak-ng -q -vqce -x "$text" > "output/m1/${label}_phonemes.txt"
                espeak-ng -vqce -s 116 -g 0 -p 46 -a 135 \
                  -w "output/m1/${label}.wav" "$text"
                ;;
            esac
          done < l3/current_pipeline_five_sentence_benchmark.txt

          for f in output/m1/*_phonemes.txt; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install F3 and OpenVoice inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2
          pip install 'numpy<2' scipy soundfile librosa==0.10.2.post1 huggingface_hub \
            eng_to_ipa==0.0.2 inflect==7.0.0 unidecode==1.3.7 \
            pypinyin==0.50.0 cn2an==0.5.22 jieba==0.42.1

      - name: Run canonical F3 fusion for each sentence
        run: |
          for label in S1 S2 S3 S4 S5; do
            echo "=== F3 ${label} ==="
            python fusion/fuse_v3_phonetic_print.py \
              /tmp/O15.wav "output/m1/${label}.wav" "output/f3/${label}_F3.wav" \
              --strength 1.0
          done

      - name: Checkout and patch official OpenVoice
        run: |
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git /tmp/OpenVoice
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/OpenVoice/openvoice/api.py')
          s = p.read_text()
          s = s.replace("if kwargs.get('enable_watermark', True):", "if False:")
          p.write_text(s)
          PY

      - name: Download same OpenVoice V2 converter and human reference as L3a
        run: |
          mkdir -p /tmp/checkpoints_v2/converter
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for name in ('config.json', 'checkpoint.pth'):
              print(hf_hub_download(
                  'myshell-ai/OpenVoiceV2',
                  f'converter/{name}',
                  local_dir='/tmp/checkpoints_v2'
              ))
          PY
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/myshell-ai/OpenVoice/main/resources/example_reference.mp3 \
            -o /tmp/openvoice_reference.mp3

      - name: Run unchanged canonical L3a on every F3 sentence
        env:
          PYTHONPATH: /tmp/OpenVoice
        run: |
          for label in S1 S2 S3 S4 S5; do
            python l3/run_openvoice_tcc.py \
              --openvoice-root /tmp/OpenVoice \
              --checkpoint-dir /tmp/checkpoints_v2/converter \
              --source "output/f3/${label}_F3.wav" \
              --target /tmp/openvoice_reference.mp3 \
              --output "output/l3a/${label}_L3a_raw.wav" \
              --master "output/l3a/${label}_L3a_44k32f.wav" \
              --metrics "output/l3a/${label}_metrics.json" \
              --tau 0.3
            ffmpeg -v error -y -i "output/l3a/${label}_L3a_raw.wav" \
              -codec:a libmp3lame -b:a 192k "output/l3a/${label}_L3a_192k.mp3"
          done

      - name: Assemble longer listening sample without processing the clips
        run: |
          python - <<'PY'
          import numpy as np
          import soundfile as sf
          from pathlib import Path

          parts = []
          sr_expected = 44100
          for i, label in enumerate(("S1","S2","S3","S4","S5")):
              y, sr = sf.read(Path("output/l3a") / f"{label}_L3a_44k32f.wav", dtype="float32")
              assert sr == sr_expected
              if y.ndim > 1:
                  y = y.mean(axis=1)
              parts.append(y)
              if i != 4:
                  parts.append(np.zeros(int(0.35 * sr_expected), dtype=np.float32))
          out = np.concatenate(parts)
          sf.write("output/CURRENT_PIPELINE_5_SENTENCES_44k32f.wav", out, sr_expected, subtype="FLOAT")
          PY
          ffmpeg -v error -y -i output/CURRENT_PIPELINE_5_SENTENCES_44k32f.wav \
            -codec:a libmp3lame -b:a 192k output/CURRENT_PIPELINE_5_SENTENCES_192k.mp3

      - name: Show diagnostic traces and hashes
        run: |
          echo "=== Exact qce phoneme traces ==="
          for f in output/m1/*_phonemes.txt; do echo "---- $f"; cat "$f"; done
          echo "=== L3a metrics ==="
          for f in output/l3a/*_metrics.json; do echo "---- $f"; cat "$f"; done
          sha256sum /tmp/O15.wav output/m1/*.wav output/f3/*.wav output/l3a/*_L3a_raw.wav \
            output/CURRENT_PIPELINE_5_SENTENCES_44k32f.wav > output/SHA256SUMS.txt
          cat output/SHA256SUMS.txt

      - name: Upload current-pipeline benchmark
        uses: actions/upload-artifact@v4
        with:
          name: current-pipeline-five-sentence-l3a
          path: |
            l3/current_pipeline_five_sentence_benchmark.txt
            l3/current_pipeline_benchmark_qce_list
            output/m1/*.wav
            output/m1/*_phonemes.txt
            output/f3/*.wav
            output/l3a/*_L3a_raw.wav
            output/l3a/*_L3a_44k32f.wav
            output/l3a/*_L3a_192k.mp3
            output/l3a/*_metrics.json
            output/CURRENT_PIPELINE_5_SENTENCES_44k32f.wav
            output/CURRENT_PIPELINE_5_SENTENCES_192k.mp3
            output/SHA256SUMS.txt
          if-no-files-found: error
