name: L3b HQ OpenVoice V2 proof

on:
  push:
    branches: [L3b-lossless-source]
    paths:
      - 'l3/L3B_RENDER_READY'

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Aeyian TTS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 unzip

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2
          pip install 'numpy<2' scipy soundfile librosa==0.10.2.post1 huggingface_hub \
            eng_to_ipa==0.0.2 inflect==7.0.0 unidecode==1.3.7 \
            pypinyin==0.50.0 cn2an==0.5.22 jieba==0.42.1

      - name: Checkout official OpenVoice
        run: |
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git /tmp/OpenVoice
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/OpenVoice/openvoice/api.py')
          s = p.read_text()
          s = s.replace("if kwargs.get('enable_watermark', True):", "if False:")
          p.write_text(s)
          PY

      - name: Download official OpenVoice V2 converter
        run: |
          mkdir -p /tmp/checkpoints_v2/converter
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for name in ('config.json', 'checkpoint.pth'):
              print(hf_hub_download('myshell-ai/OpenVoiceV2', f'converter/{name}', local_dir='/tmp/checkpoints_v2'))
          PY

      - name: Restore exact lossless O15
        run: |
          cat l3/fixtures/o15_wv_v2/chunk* > /tmp/O15.wv
          echo 'e21b9a9388cff95819a540de22a786dc5b0123a8299f2aef18432e296793ee72  /tmp/O15.wv' | sha256sum -c -
          ffmpeg -v error -y -i /tmp/O15.wv -ac 1 -ar 22050 -c:a pcm_s16le /tmp/O15.wav
          echo '32aa5bfc3fbee633c6bd1b418363dbd789b5a57610e44aadb590029a7980aacb  /tmp/O15.wav' | sha256sum -c -
          ffprobe -v error -show_entries stream=sample_rate,channels,bits_per_sample -show_entries format=duration -of default=nw=1 /tmp/O15.wav

      - name: Restore exact lossless M1 from successful qce run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10322993210/zip \
            -o /tmp/m1.zip
          mkdir -p /tmp/m1
          unzip -q /tmp/m1.zip -d /tmp/m1
          M1=$(find /tmp/m1 -type f -name 'qce_ng_v1_raw.wav' -print -quit)
          test -n "$M1"
          cp "$M1" /tmp/M1.wav
          echo 'c48c3ed9275ab2eb68ccec20bba4387146a10e6357231d9613380cc10730d641  /tmp/M1.wav' | sha256sum -c -
          ffprobe -v error -show_entries stream=sample_rate,channels,bits_per_sample -show_entries format=duration -of default=nw=1 /tmp/M1.wav

      - name: Render canonical F3 in HQ float64 path
        run: |
          mkdir -p output
          python fusion/fuse_v3_hq.py \
            /tmp/O15.wav /tmp/M1.wav output/F3_HQ_88k64f.wav --strength 1.0
          ffprobe -v error \
            -show_entries stream=sample_fmt,sample_rate,channels,bits_per_sample \
            -show_entries format=duration \
            -of default=nw=1 output/F3_HQ_88k64f.wav
          sha256sum output/F3_HQ_88k64f.wav

      - name: Download same official human reference used by L3a
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/myshell-ai/OpenVoice/main/resources/example_reference.mp3 \
            -o /tmp/openvoice_reference.mp3

      - name: Run unchanged L3 conversion on F3-HQ
        env:
          PYTHONPATH: /tmp/OpenVoice
        run: |
          python l3/run_openvoice_tcc.py \
            --openvoice-root /tmp/OpenVoice \
            --checkpoint-dir /tmp/checkpoints_v2/converter \
            --source output/F3_HQ_88k64f.wav \
            --target /tmp/openvoice_reference.mp3 \
            --output output/L3b_openvoice_raw.wav \
            --master output/L3b_openvoice_44k32f.wav \
            --metrics output/L3b_metrics.json \
            --tau 0.3
          ffmpeg -v error -y -i output/L3b_openvoice_44k32f.wav \
            -codec:a libmp3lame -b:a 192k output/L3b_openvoice_44k_192k.mp3

      - name: Show metrics
        run: cat output/L3b_metrics.json

      - name: Upload L3b artifact
        uses: actions/upload-artifact@v4
        with:
          name: L3b-f3hq-openvoice-v2-raw
          path: |
            output/F3_HQ_88k64f.wav
            output/L3b_openvoice_raw.wav
            output/L3b_openvoice_44k32f.wav
            output/L3b_openvoice_44k_192k.mp3
            output/L3b_metrics.json
          if-no-files-found: error
