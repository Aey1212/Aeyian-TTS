name: L3 OpenVoice V2 proof

on:
  push:
    branches: [L3-voice-conversion]
    paths:
      - 'l3/FIXTURE_READY'

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Aeyian TTS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2
          pip install 'numpy<2' scipy soundfile librosa==0.10.2.post1 huggingface_hub \
            eng_to_ipa==0.0.2 inflect==7.0.0 unidecode==1.3.7 \
            pypinyin==0.50.0 cn2an==0.5.22 jieba==0.42.1

      - name: Checkout official OpenVoice
        run: |
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git /tmp/OpenVoice
          # L3 is deliberately raw VC with no watermark layer. The upstream
          # constructor imports wavmark by default even though VC itself does not
          # need it; disable that optional path for this experiment.
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/OpenVoice/openvoice/api.py')
          s=p.read_text()
          s=s.replace("if kwargs.get('enable_watermark', True):", "if False:")
          p.write_text(s)
          PY

      - name: Download official OpenVoice V2 converter
        run: |
          mkdir -p /tmp/checkpoints_v2/converter
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for name in ('config.json','checkpoint.pth'):
              print(hf_hub_download('myshell-ai/OpenVoiceV2', f'converter/{name}', local_dir='/tmp/checkpoints_v2'))
          PY

      - name: Decode frozen F3 fixture
        run: |
          cat l3/fixtures/f3_source_mp3.b64.part* | base64 -d > /tmp/F3.mp3
          ffmpeg -v error -y -i /tmp/F3.mp3 -ac 1 /tmp/F3.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/F3.wav

      - name: Download official human reference
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/myshell-ai/OpenVoice/main/resources/example_reference.mp3 \
            -o /tmp/openvoice_reference.mp3

      - name: Run raw L3a tone-color conversion
        env:
          PYTHONPATH: /tmp/OpenVoice
        run: |
          mkdir -p output
          python l3/run_openvoice_tcc.py \
            --openvoice-root /tmp/OpenVoice \
            --checkpoint-dir /tmp/checkpoints_v2/converter \
            --source /tmp/F3.wav \
            --target /tmp/openvoice_reference.mp3 \
            --output output/L3a_openvoice_raw.wav \
            --master output/L3a_openvoice_44k32f.wav \
            --metrics output/L3a_metrics.json \
            --tau 0.3
          ffmpeg -v error -y -i output/L3a_openvoice_raw.wav -codec:a libmp3lame -b:a 192k output/L3a_openvoice_192k.mp3

      - name: Show metrics
        run: cat output/L3a_metrics.json

      - name: Upload L3a artifact
        uses: actions/upload-artifact@v4
        with:
          name: L3a-openvoice-v2-raw
          path: |
            output/L3a_openvoice_raw.wav
            output/L3a_openvoice_44k32f.wav
            output/L3a_openvoice_192k.mp3
            output/L3a_metrics.json
          if-no-files-found: error
